[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-rerank"
version = "0.5.0"
description = "Model-Agnostic Wide Reranker with Two-Tier Hybrid Search, Context Stitching, and Ground-Truth Verification"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "LFM Co-Processor Team" }
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "tree-sitter>=0.22.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
slm-rerank = "slm_rerank.cli:main"
slm-rerank-bench = "slm_rerank.benchmark:main"
slm-rerank-eval = "slm_rerank.eval:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["slm_rerank*"]
