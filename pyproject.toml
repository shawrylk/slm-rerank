[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lfm-rerank"
version = "0.4.0"
description = "Model-Agnostic Wide Reranker with Ground-Truth Verification and Dynamic Logprob Scoring"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "LFM Co-Processor Team" }
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "tree-sitter>=0.22.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
lfm-rerank = "lfm_rerank.cli:main"
lfm-rerank-bench = "lfm_rerank.benchmark:main"
lfm-rerank-eval = "lfm_rerank.eval:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lfm_rerank*"]
